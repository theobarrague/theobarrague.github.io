<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parkings Metz — fréquentation en temps réel</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <style>
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
    #map { height: 100%; }
    #legend {
      position: absolute; bottom: 24px; left: 12px; z-index: 1000;
      background: rgba(255,255,255,.92); padding: 10px 14px; border-radius: 8px;
      font-size: 13px; box-shadow: 0 1px 4px rgba(0,0,0,.3);
    }
    #legend .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 6px; }
    #status { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 1000;
      background: rgba(255,255,255,.92); padding: 6px 12px; border-radius: 8px; font-size: 13px; }
  </style>
</head>
<body>
  <div id="status">Chargement des parkings…</div>
  <div id="map"></div>
  <div id="legend">
    <div><span class="dot" style="background:#2ecc71"></span>Disponibilités élevées (&gt; 30 %)</div>
    <div><span class="dot" style="background:#f39c12"></span>Disponibilités faibles (10–30 %)</div>
    <div><span class="dot" style="background:#e74c3c"></span>Complet ou presque (&lt; 10 %)</div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    var WFS_URL = "https://maps.eurometropolemetz.eu/public/ows?service=WFS&version=1.0.0&request=GetFeature&typeName=public:pub_tsp_sta&srsName=EPSG:4326&outputFormat=application%2Fjson&cql_filter=id%20is%20not%20null";

    var map = L.map("map").setView([49.1194, 6.1756], 13);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    var layer = L.layerGroup().addTo(map);

    function couleur(ratio) {
      if (ratio > 0.30) return "#2ecc71";
      if (ratio > 0.10) return "#f39c12";
      return "#e74c3c";
    }

    function charger() {
      fetch(WFS_URL)
        .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function (data) {
          layer.clearLayers();
          var nb = 0;
          data.features.forEach(function (f) {
            var p = f.properties;
            var lon = f.geometry.coordinates[0], lat = f.geometry.coordinates[1];
            var total = p.place_total, libre = p.place_libre;
            var ratio = total > 0 ? libre / total : 0;
            var dispo = total > 0 ? Math.round(ratio * 100) + " % libre" : "n.d.";
            var maj = p.place_update ? new Date(p.place_update).toLocaleString("fr-FR") : "inconnue";
            L.circleMarker([lat, lon], {
              radius: 9, color: "#333", weight: 1,
              fillColor: couleur(ratio), fillOpacity: 0.85
            }).addTo(layer).bindPopup(
              "<strong>" + (p.lib || p.id) + "</strong><br>" +
              "Places libres : <strong>" + libre + " / " + total + "</strong> (" + dispo + ")<br>" +
              "Tarif : " + (p.cout || "n.d.") + "<br>" +
              "Type : " + (p.typ || "n.d.") + "<br>" +
              "<small>Maj : " + maj + "</small>"
            );
            nb++;
          });
          document.getElementById("status").textContent = nb + " parkings — données WFS Eurométropole de Metz";
        })
        .catch(function (e) {
          document.getElementById("status").textContent = "Erreur de chargement : " + e.message;
        });
    }

    charger();
    setInterval(charger, 60000);
  </script>
</body>
</html>
